name: Publish field guide to Pages

# Makes the guide openable by anyone at a first-party URL. GitHub serves .html
# files as source code, not rendered pages — so to "open" it in a browser we
# publish docs/ as a GitHub Pages site. The guide lands at the site root:
# https://<owner>.github.io/<repo>/
#
# ONE-TIME SETUP (repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions"). After that, this workflow publishes on every push that
# touches docs/, and can be run by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
